<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Apply the saved (or OS) colour theme before first paint to avoid a flash. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('ai-beacon-theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- Primary Meta (overridden per route by react-helmet-async) -->
  <title>AI Beacon — See how AI actually works</title>
  <meta name="description"
    content="A free, open-source, interactive guide to modern AI: a timeline of models, papers and tools, a live transformer simulator, a training walkthrough, sourced benchmarks, and an evidence-based look at AI's impact on work." />
  <meta name="author" content="AI Beacon contributors" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ai-beacon.pages.dev/" />
  <meta property="og:title" content="AI Beacon — See how AI actually works" />
  <meta property="og:description"
    content="Timeline, transformer simulator, training walkthrough, benchmarks and AI-impact explorer. Free, open source, runs in your browser." />
  <meta property="og:image" content="https://ai-beacon.pages.dev/og-image.png" />
  <meta property="og:site_name" content="AI Beacon" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="AI Beacon — See how AI actually works" />
  <meta name="twitter:description"
    content="Timeline, transformer simulator, training walkthrough, benchmarks and AI-impact explorer. Free and open source." />
  <meta name="twitter:image" content="https://ai-beacon.pages.dev/og-image.png" />

  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
</head>

<body>
  <noscript>
    <p style="font-family: system-ui, sans-serif; padding: 2rem; max-width: 40rem;">
      AI Beacon is an interactive app and needs JavaScript enabled to run.
    </p>
  </noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
